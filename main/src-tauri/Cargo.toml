[package]
name = "vexaris-wallet"
version = "0.1.0"
description = "Vexaris Wallet - Self-custodial multi-chain wallet"
authors = ["Vexaris"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-vexwebview = { path = "plugins/tauri-plugin-vexwebview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# P0 — kripto çekirdek
tiny-bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Debug derlemelerde bağımlılıkları (scrypt, sha2, aes-gcm, k256) optimize et.
# Kendi kodumuz hata ayıklanabilir kalır; kilit açma 5-6 sn yerine ~100 ms sürer.
[profile.dev.package."*"]
opt-level = 3

[lib]
name = "vexaris_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
